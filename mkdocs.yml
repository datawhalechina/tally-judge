# https://www.mkdocs.org/user-guide/configuration/#validation
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

# Material-Docs Theme
theme:
  name: material
  logo: _static/imgs/ragas-logo.png
  favicon: _static/favicon.ico
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - navigation.tabs
    - navigation.path
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "#bd8526"
      accent: "#bd8526"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "#bd8526"
      accent: "#bd8526"
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["./docs/extra/components/"]

# Extra CSS
extra_css:
  - extra/ragas-modern.css

exclude_docs: |
  /extra/components/

plugins:
  - search
  - social
  - copy-to-llm:
      repo_url: "https://raw.githubusercontent.com/datawhalechina/tally-judge/main/docs"
      buttons:
        copy_page: true
        copy_markdown_link: false  # Disabled until plugin bug is fixed
        view_as_markdown: false    # Disabled until plugin bug is fixed
        open_in_chatgpt: false
        open_in_claude: false
  - llmstxt:
      markdown_description: |
        TallyJudge is an open-source AI evaluation framework maintained by Datawhale, based on Ragas.
      full_output: llms-full.txt
      sections:
        Getting Started:
          - getstarted/*.md
        Tutorials:
          - tutorials/*.md
        Core Concepts:
          - concepts/*.md
          - concepts/components/*.md
        Metrics:
          - concepts/metrics/overview/*.md
          - concepts/metrics/available_metrics/*.md
        Test Data Generation:
          - concepts/test_data_generation/*.md
        Customization Guides:
          - howtos/customizations/*.md
          - howtos/customizations/metrics/*.md
          - howtos/customizations/testgenerator/*.md
          - howtos/customizations/optimizers/*.md
        Application Guides:
          - howtos/applications/*.md
        CLI:
          - howtos/cli/*.md
        Integrations:
          - howtos/integrations/*.md
        API Reference:
          - references/*.md
  - git-revision-date-localized:
      type: iso_date
  - git-authors:
      enabled: !ENV [DOCS_LOCAL_AUTHORS, true]
      show_email_address: false
  - git-committers:
      enabled: !ENV [DOCS_GITHUB_CONTRIBUTORS, false]
      repository: datawhalechina/tally-judge
      branch: main
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            members_order: source
            separate_signature: true
            filters: ["!^_"]
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_signature_annotations: true
            signature_crossrefs: true
  - glightbox
extra_javascript:
  - _static/js/mathjax.js
  - _static/js/header_border.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
