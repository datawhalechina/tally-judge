[project]
name = "tallyjudge"
description = "TallyJudge evaluation framework for RAG and LLM applications"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Datawhale" }]
keywords = ["evaluation", "rag", "llm", "llm-as-a-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2,<3"]
dynamic = ["version", "readme"]

# Installed by users who call model plugins; the plugins never import it at module level.
[project.optional-dependencies]
openai = ["openai>=2,<3"]
text-distance = ["rapidfuzz>=3,<4"]

[project.scripts]
tallyjudge = "tallyjudge.cli:main"

[project.urls]
Homepage = "https://github.com/datawhalechina/tally-judge"
Documentation = "https://github.com/datawhalechina/tally-judge/blob/main/README.md"
Code = "https://github.com/datawhalechina/tally-judge"
Issues = "https://github.com/datawhalechina/tally-judge/issues"

[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tallyjudge", "tallyjudge.*"]
namespaces = false

[tool.setuptools.package-data]
tallyjudge = ["py.typed"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools_scm]
version_file = "tallyjudge/_version.py"
# Source archives without Git metadata (for example a downloaded zip) still build.
fallback_version = "0.0.0"

# The integration group pins the SDK and schema renderer used by the migration tests.
[dependency-groups]
integration = ["openai==2.54.0", "httpx==0.28.1", "pydantic==2.14.3"]
dev = [
    "ruff",
    "pyright>=1.1.403",
    "pytest",
    "pytest-asyncio",
    "build>=1.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*/_version.py", "tools/migration"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tallyjudge"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["tallyjudge", "tests/tallyjudge/contracts/test_registry.py"]
exclude = ["tallyjudge/_version.py", "tools/migration"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests/tallyjudge"]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
