[project]
name = "tallyjudge"
description = "TallyJudge evaluation framework for RAG and LLM applications"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2,<3"]
dynamic = ["version", "readme"]

[project.scripts]
tallyjudge = "tallyjudge.cli:main"

[project.urls]
Homepage = "https://github.com/datawhalechina/tally-judge"
Documentation = "https://github.com/datawhalechina/tally-judge/tree/main/docs"
Code = "https://github.com/datawhalechina/tally-judge"
Issues = "https://github.com/datawhalechina/tally-judge/issues"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tallyjudge", "tallyjudge.*"]
namespaces = false

[tool.setuptools.package-data]
tallyjudge = ["py.typed"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools_scm]
version_file = "tallyjudge/_version.py"

# The integration group pins the SDK and schema renderer used by the migration tests.
# The legacy examples and src/ragas are not members of this environment.
[dependency-groups]
integration = ["openai==2.54.0", "httpx==0.28.1", "pydantic==2.14.3"]
dev = [
    "ruff",
    "pyright>=1.1.403",
    "pytest",
    "pytest-asyncio",
    "build>=1.3.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-static-i18n==1.3.1",
    "jieba==0.42.1",
    "mkdocs-material==9.8.1",
    "mkdocstrings[python]==1.0.8",
    "mkdocstrings-python==2.0.10",
    "mkdocs-glightbox==0.5.3",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src", "examples", "docs", "*/_version.py", "tools/migration"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tallyjudge"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["tallyjudge", "tests/tallyjudge/contracts/test_registry.py"]
exclude = ["tallyjudge/_version.py", "tools/migration"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests/tallyjudge"]
# Keep the legacy tests/conftest.py from importing ragas into the new environment.
addopts = "--confcutdir=tests/tallyjudge --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
