[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tallyjudge"
dynamic = ["version"]
description = "TallyJudge evaluation framework for RAG and LLM applications"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Datawhale" }]
keywords = ["evaluation", "rag", "llm", "llm-as-a-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dspy = ["dspy[optuna]>=3.5,<4"]
hf-tokenizers = ["tokenizers>=0.20,<1"]
langchain = ["langchain-core>=0.3,<2"]
llama-index = ["llama-index-core>=0.12,<1"]
mlflow = ["mlflow-skinny>=3,<4"]
openai = ["openai>=2,<3"]
synthesis-graph = [
    "networkx>=3,<4",
    "rapidfuzz>=3,<4",
    "scikit-network>=0.33,<0.34",
    "tiktoken>=0.8,<1",
]
text-distance = ["rapidfuzz>=3,<4"]
tiktoken = ["tiktoken>=0.8,<1"]

[project.scripts]
tallyjudge = "tallyjudge.cli:main"

[project.urls]
Homepage = "https://github.com/datawhalechina/tally-judge"
Documentation = "https://github.com/datawhalechina/tally-judge/blob/main/README.md"
Code = "https://github.com/datawhalechina/tally-judge"
Issues = "https://github.com/datawhalechina/tally-judge/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
# Migration tests compare prompts rendered by these specific SDK and schema versions.
integration = [
    "httpx==0.28.1",
    "openai==2.54.0",
    "pydantic==2.14.3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["tallyjudge", "tallyjudge.*"]
namespaces = false

[tool.setuptools.package-data]
tallyjudge = ["py.typed"]

[tool.setuptools_scm]
version_file = "tallyjudge/_version.py"
# Source archives without Git metadata (for example a downloaded zip) still build.
fallback_version = "0.0.0"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*/_version.py", "tools/migration"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tallyjudge"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["tallyjudge", "tests/tallyjudge/contracts/test_registry.py"]
exclude = ["tallyjudge/_version.py", "tools/migration"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests/tallyjudge"]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
