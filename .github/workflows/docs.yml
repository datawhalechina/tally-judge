name: Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/ragas/**
      - mkdocs.yml
      - pyproject.toml
      - package.json
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - src/ragas/**
      - mkdocs.yml
      - pyproject.toml
      - package.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Install documentation dependencies
        run: |
          uv venv --python 3.11 .venv-docs
          uv pip install --python .venv-docs --group docs
      - name: Cache social card fonts
        uses: actions/cache@v4
        with:
          path: .cache/plugin/social/fonts
          key: social-fonts-${{ runner.os }}-${{ hashFiles('mkdocs.yml', 'pyproject.toml') }}
      - name: Build documentation
        run: npm run docs:build
        env:
          DOCS_LOCAL_AUTHORS: "false"
          DOCS_GITHUB_CONTRIBUTORS: "true"
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ github.token }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
