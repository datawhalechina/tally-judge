name: CI

on:
  pull_request:
    paths:
      - tallyjudge/**
      - tests/tallyjudge/**
      - pyproject.toml
      - .python-version
      - .github/workflows/ci.yaml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check tallyjudge tests/tallyjudge
      - run: uv run --no-sync ruff format --check tallyjudge tests/tallyjudge
      - run: uv run --no-sync pyright
      - run: uv build
      - name: Verify wheel outside the checkout
        run: uv run --no-sync python tests/tallyjudge/installation/test_installation.py --wheel-dir dist

  model-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group integration
      - run: uv run --no-sync python -c "import openai, httpx"
      - run: uv run --no-sync pytest tests/tallyjudge/integration tests/tallyjudge/migration
