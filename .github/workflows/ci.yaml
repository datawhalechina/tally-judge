name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      ragas: ${{ steps.filter.outputs.ragas }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ragas:
              - .github/workflows/ci.yaml
              - pyproject.toml
              - Makefile
              - "src/ragas/**"
              - "tests/**"
              - "examples/**"

  unit_tests:
    needs: diff

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            test-type: "full"
          - os: ubuntu-latest
            python-version: "3.12"
            test-type: "full"
          - os: ubuntu-latest
            python-version: "3.13"
            test-type: "full"
          - os: macos-latest
            python-version: "3.11"
            test-type: "essential"
          - os: windows-latest
            python-version: "3.10"
            test-type: "essential"

    if: needs.diff.outputs.ragas == 'true'
    name: python${{ matrix.python-version }}_unit_tests (${{ matrix.os }}, ${{ matrix.test-type }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - run: make install-minimal

      - name: Run unit tests
        run: |
          if [ "${{ matrix.os }}" != 'windows-latest' ]; then
            OPTS=(--dist loadfile -n auto)
          fi

          if [ "${{ matrix.test-type }}" = "full" ]; then
            uv run pytest --nbmake tests/unit "${OPTS[@]}"
          else
            uv run pytest tests/unit -k "not slow" "${OPTS[@]}"
          fi
        env:
          __RAGAS_DEBUG_TRACKING: "true"
          RAGAS_DO_NOT_TRACK: "true"

  code_quality_check:
    runs-on: ubuntu-latest
    needs: diff

    if: needs.diff.outputs.ragas == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - run: make install-minimal

      - run: make run-ci-format-check type
